  <!-- Version/Feature Guard for Chrome 56 / Tizen 4 Dev Reloading -->
  <script>
    (function () {
      // Chrome 56 is Chrome v56; import.meta support started in Chrome 80
      var rawMatch = navigator.userAgent.match(/Chrome\/(\d+)/);
      var chromeVersion = rawMatch ? parseInt(rawMatch[1], 10) : 999;

      // Guard: Only run custom WebSocket polling on old Chromium engines (< Chrome 60)
      // Chrome 56 in docker presents as "Chrome/57"
      if (chromeVersion < 60) {
        console.log("Chrome < 60");
        var host = window.location.host;
        var ws = new WebSocket('ws://' + host + '/');

        ws.onmessage = function (event) {
          try {
            var data = JSON.parse(event.data);
            // Vite broadcasts 'full-reload' or 'update' on file saves
            if (data.type === 'full-reload' || data.type === 'update') {
              window.location.reload();
            }
          } catch (e) {
            // Ignore non-JSON system frames
          }
        };

        ws.onclose = function () {
          // Auto-reconnect if dev server restarts
          setTimeout(function () {
            window.location.reload();
          }, 2000);
        };
      }
      else console.log("modern browser");
    })();
  </script>
</head>
